name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up C++
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y cmake g++
    - name: Build
      run: |
        mkdir -p build
        cd build
        cmake ..
        make
